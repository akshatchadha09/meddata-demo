<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedData Batch Verification</title><link rel="stylesheet" href="/static/style.css"></head><body class="verify-body"><main class="verify-card"><div class="brand">MedData <span>AI</span></div><h1>Medicine Batch Verification</h1><div id="verifyState" class="message">Checking batch…</div><div id="verifyData"></div></main><script>const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c])); const p=new URLSearchParams(location.search).get('batch'); fetch('/api/public/verify/'+encodeURIComponent(p||'' )).then(async r=>{const d=await r.json(); if(!r.ok) throw new Error(d.detail||'Batch not found'); document.getElementById('verifyState').innerHTML='<span class="pill '+(d.status==='VERIFIED'?'ok':'critical')+'">'+d.status+'</span>'; document.getElementById('verifyData').innerHTML='<div class="verify-value">Batch '+esc(d.batch)+'</div><p>'+esc(d.medicine)+' · '+d.event_count+' recorded supply events</p>'+d.locations.map(x=>'<div class="route-line"><strong>'+esc(x.phc)+'</strong> · '+esc(x.district)+' · '+x.quantity+' units</div>').join('');}).catch(e=>document.getElementById('verifyState').textContent=e.message);</script></body></html>
